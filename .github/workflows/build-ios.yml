name: Build iOS IPA (unsigned, no game assets)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
    - name: Checkout port-target repo
      uses: actions/checkout@v4

    - name: Install CMake + Ninja + pkg-config
      run: brew install cmake ninja pkg-config

    - name: Install brew deps (incl. LLVM 18 for RexGlue)
      run: |
        brew install freetype curl protobuf fmt spdlog openssl@3
        brew install llvm@18
        brew install molten-vk
        brew list --versions freetype curl protobuf fmt spdlog openssl@3 llvm@18 molten-vk 2>&1 | head

    - name: Verify Xcode + iOS SDK
      run: |
        xcode-select -p
        xcrun --sdk iphoneos --show-sdk-version
        xcrun --sdk iphoneos --show-sdk-path

    - name: Clone upstream LibertyRecompAndroid
      run: git clone --depth=1 https://github.com/vaduur/LibertyRecompAndroid.git

    - name: Run setup_repo.py (pull submodules)
      working-directory: LibertyRecompAndroid
      run: |
        python3 tools/setup_repo.py
        du -sh .

    - name: Patch upstream — skip MoltenVK + GNS + add FetchContent
      working-directory: LibertyRecompAndroid
      run: |
        python3 - <<'PYEOF'
        # Patch thirdparty/CMakeLists.txt
        path = "thirdparty/CMakeLists.txt"
        with open(path) as f: s = f.read()
        # Delete MoltenVK add_subdirectory line (iOS has no AppKit)
        lines = s.split('\n')
        new_lines = []
        mvk_deleted = False
        for line in lines:
            if 'add_subdirectory("${LIBERTY_RECOMP_THIRDPARTY_ROOT}/MoltenVK")' in line and not line.strip().startswith('#'):
                mvk_deleted = True
                continue
            new_lines.append(line)
        s = '\n'.join(new_lines)
        if mvk_deleted:
            print("OK: MoltenVK add_subdirectory line deleted")
        # Add iOS to GNS skip list
        old_gns = 'NOT (LIBERTY_RECOMP_TARGET_PLATFORM STREQUAL "ps4" OR LIBERTY_RECOMP_TARGET_PLATFORM STREQUAL "switch" OR ANDROID)'
        new_gns = 'NOT (LIBERTY_RECOMP_TARGET_PLATFORM STREQUAL "ps4" OR LIBERTY_RECOMP_TARGET_PLATFORM STREQUAL "switch" OR ANDROID OR LIBERTY_RECOMP_TARGET_PLATFORM STREQUAL "ios")'
        if old_gns in s:
            s = s.replace(old_gns, new_gns)
            print("OK: GNS skip list patched (added iOS)")
        with open(path, "w") as f: f.write(s)
        # Patch root CMakeLists.txt: add FetchContent for fmt + spdlog
        root_path = "CMakeLists.txt"
        with open(root_path) as f: root = f.read()
        if "FetchContent_Declare(fmt" not in root:
            fetch = "# FetchContent for fmt + spdlog (vcpkg not available in CI)\n"
            fetch += "include(FetchContent)\n"
            fetch += "FetchContent_Declare(fmt GIT_REPOSITORY https://github.com/fmtlib/fmt.git GIT_TAG 11.0.2 GIT_SHALLOW TRUE)\n"
            fetch += "FetchContent_Declare(spdlog GIT_REPOSITORY https://github.com/gabime/spdlog.git GIT_TAG v1.14.1 GIT_SHALLOW TRUE)\n"
            fetch += "FetchContent_MakeAvailable(fmt spdlog)\n"
            marker = "add_subdirectory(${LIBERTY_RECOMP_THIRDPARTY_ROOT})"
            if marker in root:
                root = root.replace(marker, fetch + "\n" + marker, 1)
                print("OK: FetchContent fmt + spdlog added to root CMakeLists")
        with open(root_path, "w") as f: f.write(root)
        PYEOF

    - name: Create dummy game payload (no real assets)
      working-directory: LibertyRecompAndroid
      run: |
        mkdir -p tools/local_game_payload
        for f in default.xex default.xexp aes_key.bin common.rpf xbox360.rpf audio.rpf; do
          touch "tools/local_game_payload/$f"
        done
        mkdir -p tools/local_game_payload/{common,xbox360,audio,update}

    - name: Copy iPhone 13 config.toml
      run: |
        if [ -f config.toml ]; then
          cp config.toml LibertyRecompAndroid/config.toml
        fi

    - name: Configure (iOS Release, Metal backend)
      working-directory: LibertyRecompAndroid
      env:
        CC: /opt/homebrew/opt/llvm@18/bin/clang
        CXX: /opt/homebrew/opt/llvm@18/bin/clang++
      run: |
        cmake --preset ios-release \
          -DCMAKE_C_COMPILER=/opt/homebrew/opt/llvm@18/bin/clang \
          -DCMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm@18/bin/clang++ \
          -DREXGLUE_USE_VULKAN=OFF \
          -DUSE_REXGLUE_RUNTIME=OFF \
          -DLIBERTY_IOS_DEVELOPMENT_TEAM="" \
          -DLIBERTY_IOS_BUNDLE_IDENTIFIER="com.libertyrecomp.iphone13" \
          -DLIBERTY_RECOMP_EMBEDDED_ASSETS=OFF \
          -DFREETYPE_INCLUDE_DIR_freetype2=/opt/homebrew/include/freetype2 \
          -DFREETYPE_INCLUDE_DIR_ft2build=/opt/homebrew/include/freetype2 \
          -DFREETYPE_LIBRARY=/opt/homebrew/lib/libfreetype.dylib \
          -DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3 \
          -DOPENSSL_CRYPTO_LIBRARY=/opt/homebrew/opt/openssl@3/lib/libcrypto.dylib \
          -DOPENSSL_SSL_LIBRARY=/opt/homebrew/opt/openssl@3/lib/libssl.dylib \
          -DOPENSSL_INCLUDE_DIR=/opt/homebrew/opt/openssl@3/include \
          -DCURL_INCLUDE_DIR=/opt/homebrew/include \
          -DCURL_LIBRARY=/opt/homebrew/lib/libcurl.dylib

    - name: Build .app (may take 30-60 min)
      working-directory: LibertyRecompAndroid
      run: |
        cmake --build out/build/ios-release --config Release -j$(sysctl -n hw.ncpu) 2>&1 | tail -150

    - name: Locate built .app
      id: locate
      run: |
        set -e
        APP=$(find LibertyRecompAndroid/out/build/ios-release -name "*.app" -type d 2>/dev/null | head -1)
        echo "Found app: $APP"
        if [ -z "$APP" ]; then
          echo "=== no .app found, build dir listing ==="
          ls -la LibertyRecompAndroid/out/build/ios-release/ 2>/dev/null
          find LibertyRecompAndroid/out -type f \( -name "*.o" -o -name "Liberty*" \) 2>/dev/null | head -20
          exit 1
        fi
        echo "app_path=$APP" >> $GITHUB_OUTPUT
        du -sh "$APP"

    - name: Package unsigned .ipa
      run: |
        set -e
        APP="${{ steps.locate.outputs.app_path }}"
        APP_DIR=$(dirname "$APP")
        APP_NAME=$(basename "$APP")
        cd "$APP_DIR"
        rm -rf Payload
        mkdir Payload
        cp -R "$APP_NAME" Payload/
        zip -r -q "LibertyRecomp-unsigned.ipa" Payload
        ls -la "LibertyRecomp-unsigned.ipa"

    - name: Upload .ipa artifact
      uses: actions/upload-artifact@v4
      with:
        name: LibertyRecomp-unsigned-ipa
        path: LibertyRecompAndroid/out/build/ios-release/**/LibertyRecomp-unsigned.ipa
        retention-days: 30

    - name: Upload build logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-logs
        path: |
          LibertyRecompAndroid/out/build/ios-release/CMakeCache.txt
          LibertyRecompAndroid/out/build/ios-release/CMakeFiles/CMakeOutput.log
          LibertyRecompAndroid/out/build/ios-release/CMakeFiles/CMakeError.log
        retention-days: 30
        if-no-files-found: ignore
