name: Build iOS IPA via vcpkg (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 240

    steps:
    - name: Checkout port-target repo
      uses: actions/checkout@v4

    - name: Install CMake 4.4.4+ + Ninja (vcpkg requires cmake 4.4.4)
      run: |
        brew install ninja
        pip install cmake==4.4.4
        cmake --version

    - name: Verify Xcode + iOS SDK
      run: |
        xcode-select -p
        xcrun --sdk iphoneos --show-sdk-version

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg
        /tmp/vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=/tmp/vcpkg" >> $GITHUB_ENV

    - name: Copy custom arm64-ios triplet into vcpkg
      run: |
        cp vcpkg/triplets/arm64-ios.cmake /tmp/vcpkg/triplets/
        echo "=== installed triplet ==="
        cat /tmp/vcpkg/triplets/arm64-ios.cmake

    - name: Clone upstream LibertyRecompAndroid
      run: git clone --depth=1 https://github.com/vaduur/LibertyRecompAndroid.git

    - name: Run setup_repo.py (pull submodules)
      working-directory: LibertyRecompAndroid
      run: |
        python3 tools/setup_repo.py
        du -sh .

    - name: Patch upstream — skip MoltenVK + GNS + discord-rpc (iOS has no AppKit)
      working-directory: LibertyRecompAndroid
      run: |
        python3 - <<'PYEOF'
        # Patch thirdparty/CMakeLists.txt
        path = "thirdparty/CMakeLists.txt"
        with open(path) as f: s = f.read()
        # Delete MoltenVK add_subdirectory line
        lines = s.split('\n')
        new_lines = []
        mvk_deleted = False
        for line in lines:
            if 'add_subdirectory("${LIBERTY_RECOMP_THIRDPARTY_ROOT}/MoltenVK")' in line and not line.strip().startswith('#'):
                mvk_deleted = True
                continue
            new_lines.append(line)
        s = '\n'.join(new_lines)
        if mvk_deleted: print("OK: MoltenVK skipped")
        # Add iOS to GNS skip list
        old_gns = 'NOT (LIBERTY_RECOMP_TARGET_PLATFORM STREQUAL "ps4" OR LIBERTY_RECOMP_TARGET_PLATFORM STREQUAL "switch" OR ANDROID)'
        new_gns = 'NOT (LIBERTY_RECOMP_TARGET_PLATFORM STREQUAL "ps4" OR LIBERTY_RECOMP_TARGET_PLATFORM STREQUAL "switch" OR ANDROID OR LIBERTY_RECOMP_TARGET_PLATFORM STREQUAL "ios")'
        if old_gns in s:
            s = s.replace(old_gns, new_gns)
            print("OK: GNS skipped on iOS")
        with open(path, "w") as f: f.write(s)
        # Patch vcpkg.json: discord-rpc uses AppKit (macOS only). Exclude iOS.
        import json
        with open("vcpkg.json") as f: vj = json.load(f)
        for dep in vj.get("dependencies", []):
            if not isinstance(dep, dict): continue
            if dep.get("name") == "discord-rpc":
                # Update platform filter to also exclude iOS
                plat = dep.get("platform", "")
                if "ios" not in plat:
                    dep["platform"] = "!ps4 & !ps5 & !ios"
                    print("OK: discord-rpc excluded on iOS")
        with open("vcpkg.json", "w") as f: json.dump(vj, f, indent=4)
        # Add find_package calls to root CMakeLists.txt for vcpkg deps
        # (LibertyRecomp links fmt::fmt, spdlog::spdlog, SDL3::SDL3-static, etc.
        # but upstream doesn't call find_package — assumes vcpkg toolchain auto-links.
        # With USE_REXGLUE_RUNTIME=OFF, those targets need explicit find_package.)
        root_path = "CMakeLists.txt"
        with open(root_path) as f: root = f.read()
        if "find_package(fmt CONFIG REQUIRED)" not in root:
            fp_block = "# find_package for vcpkg deps (added by iOS build patch)\n"
            fp_block += "find_package(fmt CONFIG REQUIRED)\n"
            fp_block += "find_package(spdlog CONFIG REQUIRED)\n"
            fp_block += "find_package(freetype CONFIG REQUIRED)\n"
            fp_block += "find_package(CURL CONFIG REQUIRED)\n"
            fp_block += "find_package(Protobuf CONFIG REQUIRED)\n"
            fp_block += "find_package(OpenSSL REQUIRED)\n"
            fp_block += "find_package(unofficial-utfcpp CONFIG REQUIRED)\n"
            fp_block += "find_package(date CONFIG REQUIRED)\n"
            marker = "add_subdirectory(${LIBERTY_RECOMP_THIRDPARTY_ROOT})"
            if marker in root:
                root = root.replace(marker, fp_block + "\n" + marker, 1)
                print("OK: find_package calls added for vcpkg deps")
        with open(root_path, "w") as f: f.write(root)
        PYEOF

    - name: Create dummy game payload (no real assets)
      working-directory: LibertyRecompAndroid
      run: |
        mkdir -p tools/local_game_payload
        for f in default.xex default.xexp aes_key.bin common.rpf xbox360.rpf audio.rpf; do
          touch "tools/local_game_payload/$f"
        done
        mkdir -p tools/local_game_payload/{common,xbox360,audio,update}

    - name: Copy iPhone 13 config.toml
      run: cp config.toml LibertyRecompAndroid/config.toml || true

    - name: Configure (iOS Release, Metal, vcpkg arm64-ios triplet)
      working-directory: LibertyRecompAndroid
      run: |
        cmake --preset ios-release \
          -DLIBERTY_IOS_DEVELOPMENT_TEAM="" \
          -DLIBERTY_IOS_BUNDLE_IDENTIFIER="com.libertyrecomp.iphone13" \
          -DLIBERTY_RECOMP_EMBEDDED_ASSETS=OFF \
          -DUSE_REXGLUE_RUNTIME=OFF \
          -DCMAKE_TOOLCHAIN_FILE=/tmp/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=arm64-ios \
          -DVCPKG_HOST_TRIPLET=arm64-osx \
          -DVCPKG_OVERLAY_TRIPLETS=/tmp/vcpkg/triplets \
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${sourceDir}/toolchains/ios.cmake \
          -GXcode

    - name: Build .app (vcpkg builds deps from source, may take 60-90 min)
      working-directory: LibertyRecompAndroid
      run: |
        cmake --build out/build/ios-release --config Release -j$(sysctl -n hw.ncpu) 2>&1 | tail -200

    - name: Locate built .app
      id: locate
      run: |
        set -e
        APP=$(find LibertyRecompAndroid/out/build/ios-release -name "*.app" -type d 2>/dev/null | head -1)
        echo "Found app: $APP"
        if [ -z "$APP" ]; then
          echo "=== no .app found ==="
          ls -la LibertyRecompAndroid/out/build/ios-release/ 2>/dev/null
          exit 1
        fi
        echo "app_path=$APP" >> $GITHUB_OUTPUT
        du -sh "$APP"

    - name: Package unsigned .ipa
      run: |
        set -e
        APP="${{ steps.locate.outputs.app_path }}"
        APP_DIR=$(dirname "$APP")
        APP_NAME=$(basename "$APP")
        cd "$APP_DIR"
        rm -rf Payload
        mkdir Payload
        cp -R "$APP_NAME" Payload/
        zip -r -q "LibertyRecomp-unsigned.ipa" Payload
        ls -la "LibertyRecomp-unsigned.ipa"

    - name: Upload .ipa artifact
      uses: actions/upload-artifact@v4
      with:
        name: LibertyRecomp-unsigned-ipa
        path: LibertyRecompAndroid/out/build/ios-release/**/LibertyRecomp-unsigned.ipa
        retention-days: 30

    - name: Upload build logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-logs
        path: |
          LibertyRecompAndroid/out/build/ios-release/CMakeCache.txt
          LibertyRecompAndroid/out/build/ios-release/CMakeFiles/CMakeOutput.log
          LibertyRecompAndroid/out/build/ios-release/CMakeFiles/CMakeError.log
        retention-days: 30
        if-no-files-found: ignore
